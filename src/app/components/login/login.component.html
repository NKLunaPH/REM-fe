<div class="login-container">
  <div class="background-animation">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="login-card">
    <div class="card-header">
      <div class="logo">
        <i class="fa-solid fa-house-chimney"></i>
        <span>Lumina Estates</span>
      </div>
      <h2>Welcome Back</h2>
      <p>Enter your details to access your account.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div *ngIf="error" class="global-error">
        {{ error }}
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper" [class.error]="f['email']?.invalid && f['email']?.touched">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="admin@example.com"
            autocomplete="email">
        </div>
        <div class="error-message" *ngIf="f['email']?.invalid && f['email']?.touched">
          <span *ngIf="f['email']?.errors?.['required']">Email is required</span>
          <span *ngIf="f['email']?.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper" [class.error]="f['password']?.invalid && f['password']?.touched">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="••••••••"
            autocomplete="current-password">
        </div>
        <div class="error-message" *ngIf="f['password']?.invalid && f['password']?.touched">
          <span *ngIf="f['password']?.errors?.['required']">Password is required</span>
          <span *ngIf="f['password']?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div class="form-actions-row">
        <label class="checkbox-container">
          <input type="checkbox">
          <span class="checkmark"></span>
          Remember me
        </label>
        <a routerLink="/forgot-password" class="forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <div class="spinner" *ngIf="isLoading"></div>
      </button>
    </form>

    <div class="card-footer">
      <p>Don't have an account? <a routerLink="/register">Sign up now</a></p>
    </div>
  </div>
</div>
